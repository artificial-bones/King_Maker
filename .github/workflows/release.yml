name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the release, like v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build King_Maker.zip
        run: ./build.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          gh release create "$VERSION" King_Maker.zip \
            --title "King Maker $VERSION" \
            --notes "King Maker 2.0: every King addon is now one addon with one window, one minimap crown (left-click: King Maker and all your addon buttons; right-click: quick actions) and one Settings page. Every slash command still works. Download King_Maker.zip, unzip it, and copy every folder into your Interface\\AddOns folder (say yes to replace). Upgrading from 1.x: the old-named folders in the zip carry your settings and data into King Maker on your first login; delete them afterwards. See the README."
      - name: Upload to CurseForge
        if: env.CF_API_TOKEN != ''
        env:
          CF_PROJECT_ID: "1759872"
          CF_GAME_VERSION: "1.60.1"
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          api=https://wow.curseforge.com/api
          versions=$(curl -sf -H "X-Api-Token: $CF_API_TOKEN" "$api/game/versions")
          ids=$(echo "$versions" | jq -c --arg v "$CF_GAME_VERSION" '[.[] | select(.name == $v) | .id]')
          echo "CurseForge game version ids for $CF_GAME_VERSION: $ids"
          if [ "$ids" = "[]" ]; then
            echo "CurseForge has no game version named $CF_GAME_VERSION"; exit 1
          fi
          metadata=$(jq -nc --arg name "King Maker $VERSION" --argjson ids "$ids" \
            '{displayName: $name, changelog: "King Maker 2.0: every King addon is now one addon with one window and one minimap crown. Upgrading from 1.x keeps all your settings and data: the old-named folders carry them in on your first login (restart the game once). See the README on GitHub.", changelogType: "markdown", releaseType: "release", gameVersions: $ids}')
          curl -sf -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=$metadata" -F "file=@King_Maker.zip" \
            "$api/projects/$CF_PROJECT_ID/upload-file"
